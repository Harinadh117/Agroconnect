<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroConnect</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ========== AUTH SECTION ========== -->
<div id="authSection">
    <div class="auth-container">
        <div class="auth-header">
            <h1>AgroConnect</h1>
            <p>Farmer Workforce & Land Sharing Platform</p>
        </div>
        <div class="auth-tabs">
            <button class="auth-tab active" onclick="showAuthTab('login')">Login</button>
            <button class="auth-tab" onclick="showAuthTab('register')">Register</button>
        </div>

        <!-- Login -->
        <div id="loginForm" class="auth-form">
            <div id="loginMsg" class="message hidden"></div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="loginPhone" maxlength="10" placeholder="10-digit phone">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Password">
            </div>
            <button class="btn btn-primary" onclick="login()">Login</button>
        </div>

        <!-- Register -->
        <div id="registerForm" class="auth-form hidden">
            <div id="regMsg" class="message hidden"></div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="regName" placeholder="Your name">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="regPhone" maxlength="10" placeholder="10-digit phone">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="Create password">
            </div>
            <div class="form-group">
                <label>Role</label>
                <select id="regRole" onchange="toggleRoleFields()">
                    <option value="">Select role</option>
                    <option value="FARMER">Farmer</option>
                    <option value="WORKER">Agricultural Worker</option>
                    <option value="KAVULU">Kavulu Farmer</option>
                </select>
            </div>
            <div class="form-group">
                <label>Village</label>
                <input type="text" id="regVillage" placeholder="Village">
            </div>
            <div class="form-group">
                <label>District</label>
                <input type="text" id="regDistrict" placeholder="District">
            </div>
            <div class="form-group">
                <label>State</label>
                <input type="text" id="regState" placeholder="State">
            </div>
            <!-- Worker fields -->
            <div id="workerFields" class="hidden">
                <div class="form-group">
                    <label>Work Type</label>
                    <input type="text" id="regWorkType" placeholder="e.g., Harvesting, Ploughing">
                </div>
                <div class="form-group">
                    <label>Experience</label>
                    <input type="text" id="regExperience" placeholder="e.g., 2 years harvesting">
                </div>
                <div class="form-group">
                    <label>Available Days</label>
                    <input type="number" id="regAvailDays" placeholder="e.g., 5">
                </div>
            </div>
            <!-- Kavulu fields -->
            <div id="kavuluFields" class="hidden">
                <div class="form-group">
                    <label>Preferred Crop</label>
                    <input type="text" id="regCrop" placeholder="e.g., Rice, Cotton">
                </div>
                <div class="form-group">
                    <label>Experience</label>
                    <input type="text" id="regKavuluExp" placeholder="e.g., 3 years paddy">
                </div>
            </div>
            <button class="btn btn-primary" onclick="register()">Register</button>
        </div>
    </div>
</div>

<!-- ========== DASHBOARD SECTION ========== -->
<div id="dashboardSection" class="hidden">
    <div class="header">
        <h1>AgroConnect</h1>
        <div class="user-info">
            <span>Welcome, <strong id="userName"></strong> (<span id="userRole"></span>)</span>
            <button class="btn btn-secondary" onclick="openProfileEditModal()">Edit Profile</button>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="dashboard">
        <div id="globalMsg" class="message hidden"></div>

        <!-- Profile Edit Modal -->
        <div id="profileModal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Edit Profile</h2>
                    <button class="close-btn" onclick="closeProfileModal()">&times;</button>
                </div>
                <div id="profileMsg" class="message hidden"></div>
                <form id="profileForm">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="profileName" placeholder="Your name" required>
                    </div>
                    <div class="form-group">
                        <label>Village</label>
                        <input type="text" id="profileVillage" placeholder="Village">
                    </div>
                    <div class="form-group">
                        <label>District</label>
                        <input type="text" id="profileDistrict" placeholder="District">
                    </div>
                    <div class="form-group">
                        <label>State</label>
                        <input type="text" id="profileState" placeholder="State">
                    </div>

                    <!-- Worker Fields -->
                    <div id="profileWorkerFields" class="hidden">
                        <div class="form-group">
                            <label>Work Type</label>
                            <input type="text" id="profileWorkType" placeholder="e.g., Harvesting, Ploughing">
                        </div>
                        <div class="form-group">
                            <label>Experience</label>
                            <input type="text" id="profileExperience" placeholder="e.g., 2 years harvesting">
                        </div>
                        <div class="form-group">
                            <label>Available Days</label>
                            <input type="number" id="profileAvailDays" placeholder="e.g., 5">
                        </div>
                        <div class="form-group">
                            <label>Available From</label>
                            <input type="date" id="profileAvailFrom">
                        </div>
                    </div>

                    <!-- Farmer/Kavulu Fields -->
                    <div id="profileFarmerFields" class="hidden">
                        <div class="form-group">
                            <label>Preferred Crop</label>
                            <input type="text" id="profileCrop" placeholder="e.g., Rice, Cotton">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeProfileModal()">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Profile</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="tabs" class="tabs"></div>
        <div id="content"></div>
    </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
